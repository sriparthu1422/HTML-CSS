<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            font-family: Arial;
            margin-bottom: 0;
            margin-top: 0;
        }
        .currency{
            font-size: 40px;
            margin-bottom: 8px;
        }
        .currency-name{
            font-size: 20px;
            font-weight: 100;
            color: rgb(100,100,100);
        }
        .currency-ince{
            color: rgb(24, 126, 56);
            font-size: 16px;
        }
        .currency-hr{
            margin-top: 10px;
            color: rgb(100, 100, 100);
            font-size: 16px;
        }
        .currency-after-hr{
           color: rgb(235, 39, 39); 
        }
    </style>
</head>
<body>
    <p class="currency">1,049.61 <span class="currency-name">USD</span></p>
    <p class="currency-ince">+18.05(175%) today</p>
    <p class="currency-hr">After hours 1,048.00 <span class="currency-after-hr">-1.61 (0.15%)</span></p>
</body>
</html>
