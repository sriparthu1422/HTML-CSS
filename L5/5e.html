<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            font-family: Arial;
            margin-bottom: 0;
            margin-top: 0;
            text-align: center;
        }
        .new{
            color: rgb(245, 99, 0);
            margin-bottom: 10px;
        }
        .mbp{
            font-weight: bold;
            font-size: 25px;
        }
        .sfp{
            font-weight: bold;
            font-size: 50px;
            margin-bottom: 15px;
        }
        .doller{
            margin-bottom: 20px;
        }
        .btn{
            background-color: rgb(0, 113, 227);
            color: white;
            border-radius: 20px;
            padding-top: 8px;
            padding-bottom: 8px;
            padding-right: 12px;
            padding-left: 12px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <p class="new">New</p>
    <p class="mbp">MacBook Pro</p>
    <p class="sfp">Supercharged for pros.</p>
    <p class="doller">From $1999</p>
    <p><span class="btn">Buy</span></p>
</body>
</html>
