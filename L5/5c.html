<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            margin-bottom: 0;
            margin-top: 0;
            font-family: Verdana;
        }
        .course{
            font-weight: bold;
            font-size: 30px;
            margin-bottom: 5px;
        }
        .bp{
            color: rgb(100, 100, 100);
            margin-bottom: 20px;
        }

        .skill{
            width: 300px;
            line-height: 22px;
            
        }
        .start-btn{
            border: none;
            border-radius: 6px;
            background-color: green;
            padding-left: 16px;
            padding-right: 16px;
            padding-top: 9px;
            padding-bottom: 9px;
            color: white;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <p class="course">HTML CSS Course</p>
    <p class="bp">Beginner to Pro</p>
    <p class="skill">In this course, we'll learn the skills you need to become a developer</p>
    <button class="start-btn">Get Started</button>
</body>
</html>
